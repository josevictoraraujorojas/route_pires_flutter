server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Funciona com ou sem a remoção de /app pelo proxy do Coolify.
    location = /app {
        return 301 /app/;
    }

    location ^~ /app/ {
        rewrite ^/app/(.*)$ /$1 last;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
